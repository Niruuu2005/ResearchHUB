global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "researchops_api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets:
          - "localhost:8000"
          - "127.0.0.1:8000"
          - "api:8000"
          - "host.docker.internal:8000"
        labels:
          app: "researchops-ai"
          environment: "production"

  - job_name: "prometheus"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "localhost:9090"
