---
- name: Deploy ResearchOps AI Platform on AWS EC2
  hosts: research_server
  become: true
  vars:
    repo_url: "https://github.com/Niruuu2005/ResearchHUB.git"
    repo_branch: "main"
    app_dir: "/opt/researchhub"
    api_port: 8000
    gateway_port: 80
    grafana_port: 3001
    prometheus_port: 9090

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies, Git, and Docker Compose plugin
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - docker.io
          - docker-compose-v2
        state: present

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create application deployment directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Check if application repository already exists
      stat:
        path: "{{ app_dir }}/.git"
      register: repo_git_dir

    - name: Clone repository from GitHub
      command: git clone -b {{ repo_branch }} {{ repo_url }} {{ app_dir }}
      when: not repo_git_dir.stat.exists
      become_user: ubuntu

    - name: Pull latest code from GitHub
      command: git pull origin {{ repo_branch }}
      args:
        chdir: "{{ app_dir }}"
      when: repo_git_dir.stat.exists
      become_user: ubuntu

    - name: Deploy ResearchOps AI Multi-Container Stack via Docker Compose
      command: docker compose up --build -d
      args:
        chdir: "{{ app_dir }}"
      environment:
        APP_ENV: "production"

    - name: Run Alembic database schema migrations
      command: docker compose exec -T api alembic upgrade head
      args:
        chdir: "{{ app_dir }}"
      register: migration_output
      ignore_errors: yes

    - name: Wait 10 seconds for service mesh stabilization
      pause:
        seconds: 10

    - name: Verify application liveness probe (/health)
      uri:
        url: "http://127.0.0.1:{{ api_port }}/health"
        method: GET
        status_code: 200
        return_content: yes
      register: health_response
      retries: 8
      delay: 5
      until: health_response.status == 200

    - name: Verify system readiness probe (/ready)
      uri:
        url: "http://127.0.0.1:{{ api_port }}/ready"
        method: GET
        status_code: 200
        return_content: yes
      register: ready_response
      retries: 6
      delay: 5
      until: ready_response.status == 200

    - name: Verify Prometheus metrics exporter (/metrics)
      uri:
        url: "http://127.0.0.1:{{ api_port }}/metrics"
        method: GET
        status_code: 200
      register: metrics_response

    - name: Display deployment success telemetry
      debug:
        msg: >-
          ResearchOps AI platform deployed successfully!
          Liveness: {{ health_response.json }}
          Readiness: {{ ready_response.json }}
          Gateway: http://localhost:{{ gateway_port }}
          Metrics: http://localhost:{{ prometheus_port }}
          Observability: http://localhost:{{ grafana_port }}
