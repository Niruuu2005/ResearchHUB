apiVersion: v1
kind: Secret
metadata:
  name: researchops-secret
  namespace: researchops
  labels:
    app.kubernetes.io/name: researchops
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  POSTGRES_USER: "researchops"
  POSTGRES_PASSWORD: "researchops_secret"
  POSTGRES_DB: "researchops"
  DATABASE_URL: "postgresql+psycopg2://researchops:researchops_secret@postgres:5432/researchops"
  REDIS_URL: "redis://redis:6379/0"
