apiVersion: v1
kind: ConfigMap
metadata:
  name: researchops-config
  namespace: researchops
  labels:
    app.kubernetes.io/name: researchops
    app.kubernetes.io/component: config
data:
  APP_NAME: "ResearchOps AI"
  APP_VERSION: "2.0.0"
  APP_ENV: "production"
  STORAGE_PATH: "/app/data/documents"
  EXPORT_STORAGE_PATH: "/app/data/exports"
  USE_CELERY: "true"
  EMBEDDING_PROVIDER: "auto"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  ENABLE_WIKIPEDIA: "true"
  ENABLE_OPENALEX: "true"
  ENABLE_CROSSREF: "true"
